# Learn more about services, parameters and containers at
# http://symfony.com/doc/current/service_container.html
parameters:
#    parameter_name: value

services:
#    service_name:
#        class: AppBundle\Directory\ClassName
#        arguments: ["@another_service_name", "plain_value", "%parameter_name%"]

services:
 twig.extension.text:
     class: Twig_Extensions_Extension_Text
     tags:
         - { name: twig.extension }
 # DigitalOcean Spaces. Credentials live in parameters.yml, never in the database
 # and never in the app.
 app.spaces:
     class: AppBundle\Service\SpacesClient
     arguments:
         - "%spaces_key%"
         - "%spaces_secret%"
         - "%spaces_region%"
         - "%spaces_bucket%"
         - "%spaces_endpoint%"
         - "%spaces_cdn%"
